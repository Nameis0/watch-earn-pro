<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KTM 3D Highway Simulator</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body { background:#000; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #canvas-container { width:100vw; height:100vh; position:absolute; top:0; left:0; }
    
    /* HUD Overlays */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 102, 0, 0.4);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(255, 102, 0, 0.2);
    }
    .speed-val { font-size: 32px; font-weight: 900; color: #ff6600; line-height: 1; }
    .speed-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 20px; font-weight: 800; color: #fff; text-align: right; }

    /* Touch Controls for Mobile */
    #controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
      z-index: 10;
    }
    .ctrl-group { display: flex; gap: 14px; pointer-events: auto; }
    .ctrl-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #ff6600;
      color: #ff6600;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
      touch-action: none;
    }
    .ctrl-btn:active { background: #ff6600; color: #fff; }

    #back-btn {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 20px;
      color: #cbd5e1;
      font-size: 11px;
      cursor: pointer;
      z-index: 20;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <button id="back-btn" onclick="location.href='/'">← Exit to Dashboard</button>
  
  <div id="hud">
    <div class="hud-card">
      <div class="speed-val" id="speedDisplay">0</div>
      <div class="speed-lbl">KM/H</div>
    </div>
    <div class="hud-card">
      <div class="score-val" id="scoreDisplay">0 m</div>
      <div class="speed-lbl" style="text-align:right;">Distance</div>
    </div>
  </div>

  <div id="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn" id="btnLeft">◀</button>
      <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
    <div class="ctrl-group">
      <button class="ctrl-btn" id="btnBrake" style="border-color:#ef4444; color:#ef4444;">▼</button>
      <button class="ctrl-btn" id="btnGas" style="border-color:#22c55e; color:#22c55e;">▲</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- THREE.JS HIGHWAY SIMULATOR ENGINE ---
    let scene, camera, renderer, bike, road, markings = [], traffic = [];
    let speed = 0, maxSpeed = 160, distance = 0;
    let bikeX = 0, targetBikeX = 0, bikeRoll = 0;
    let keys = { left:false, right:false, gas:false, brake:false };

    function init() {
      const container = document.getElementById("canvas-container");
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050914, 0.015);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3.2, -5.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0x334155, 0.8);
      scene.add(ambientLight);

      const moonLight = new THREE.DirectionalLight(0x60a5fa, 0.7);
      moonLight.position.set(20, 40, -30);
      scene.add(moonLight);

      buildRoad();
      buildBike();
      setupControls();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function buildRoad() {
      // Asphalt Road plane
      const roadGeo = new THREE.PlaneGeometry(16, 400);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
      road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.z = 150;
      scene.add(road);

      // Lane Dash Markings
      const dashGeo = new THREE.PlaneGeometry(0.3, 4);
      const dashMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
      for(let z = 0; z < 400; z += 10) {
        const dash = new THREE.Mesh(dashGeo, dashMat);
        dash.rotation.x = -Math.PI / 2;
        dash.position.set(0, 0.02, z);
        scene.add(dash);
        markings.push(dash);
      }
    }

    function buildBike() {
      bike = new THREE.Group();

      // Main Chassis / Frame (KTM Orange & Slate Black)
      const frameGeo = new THREE.BoxGeometry(0.5, 0.45, 1.4);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0xff6600, metalness: 0.8, roughness: 0.2 });
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.y = 0.75;
      bike.add(frame);

      // Fuel Tank Accent
      const tankGeo = new THREE.BoxGeometry(0.46, 0.3, 0.7);
      const tankMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.1 });
      const tank = new THREE.Mesh(tankGeo, tankMat);
      tank.position.set(0, 1.05, -0.1);
      bike.add(tank);

      // Headlight Cowl
      const cowlGeo = new THREE.ConeGeometry(0.25, 0.4, 4);
      const cowlMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
      const cowl = new THREE.Mesh(cowlGeo, cowlMat);
      cowl.rotation.x = Math.PI / 2;
      cowl.position.set(0, 0.95, 0.7);
      bike.add(cowl);

      // Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.22, 24);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.9 });
      
      const rearWheel = new THREE.Mesh(wheelGeo, wheelMat);
      rearWheel.rotation.z = Math.PI / 2;
      rearWheel.position.set(0, 0.38, -0.7);
      bike.add(rearWheel);

      const frontWheel = new THREE.Mesh(wheelGeo, wheelMat);
      frontWheel.rotation.z = Math.PI / 2;
      frontWheel.position.set(0, 0.38, 0.7);
      bike.add(frontWheel);

      // Bright Headlight Beam
      const spot = new THREE.SpotLight(0xffffff, 4, 60, Math.PI / 6, 0.4);
      spot.position.set(0, 0.9, 0.8);
      spot.target.position.set(0, 0.2, 20);
      bike.add(spot);
      bike.add(spot.target);

      scene.add(bike);
    }

    function setupControls() {
      window.addEventListener('keydown', e => {
        if(e.key === "ArrowLeft" || e.key === "a") keys.left = true;
        if(e.key === "ArrowRight" || e.key === "d") keys.right = true;
        if(e.key === "ArrowUp" || e.key === "w") keys.gas = true;
        if(e.key === "ArrowDown" || e.key === "s") keys.brake = true;
      });
      window.addEventListener('keyup', e => {
        if(e.key === "ArrowLeft" || e.key === "a") keys.left = false;
        if(e.key === "ArrowRight" || e.key === "d") keys.right = false;
        if(e.key === "ArrowUp" || e.key === "w") keys.gas = false;
        if(e.key === "ArrowDown" || e.key === "s") keys.brake = false;
      });

      const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
      };
      bindTouch("btnLeft", "left");
      bindTouch("btnRight", "right");
      bindTouch("btnGas", "gas");
      bindTouch("btnBrake", "brake");
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Acceleration & Braking Physics
      if (keys.gas) {
        speed = Math.min(speed + 0.8, maxSpeed);
      } else if (keys.brake) {
        speed = Math.max(speed - 1.5, 0);
      } else {
        speed = Math.max(speed - 0.25, 0);
      }

      // Steering & Body Lean
      if (speed > 5) {
        if (keys.left && targetBikeX > -6) {
          targetBikeX -= 0.12;
          bikeRoll = Math.max(bikeRoll - 0.04, -0.38);
        } else if (keys.right && targetBikeX < 6) {
          targetBikeX += 0.12;
          bikeRoll = Math.min(bikeRoll + 0.04, 0.38);
        } else {
          bikeRoll *= 0.88;
        }
      } else {
        bikeRoll *= 0.85;
      }

      bikeX += (targetBikeX - bikeX) * 0.1;
      bike.position.x = bikeX;
      bike.rotation.z = -bikeRoll;

      // Road Motion Animation based on Speed
      const moveStep = (speed / 10);
      distance += (speed * 0.02);

      markings.forEach(dash => {
        dash.position.z -= moveStep;
        if (dash.position.z < -10) dash.position.z += 400;
      });

      // Smooth Dynamic Chase Camera
      camera.position.x = bike.position.x * 0.45;
      camera.lookAt(bike.position.x, 1.2, 10);

      // HUD Updates
      document.getElementById("speedDisplay").innerText = Math.floor(speed);
      document.getElementById("scoreDisplay").innerText = Math.floor(distance) + " m";

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
